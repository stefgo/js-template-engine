name: Create Release

# A release is an action, not a side effect of pushing: a version is published
# only from here, only on request -- a release on main, a beta (x.y.z-beta.n,
# on the beta dist-tag) on dev. A push to either branch only runs the checks.
#
# What a release is, how its version is found and how its notes are put
# together is the same for every stefgo project and lives in
# https://github.com/stefgo/release-workflows. This file offers the inputs and
# says what is particular here: the checks, and that the package is published.
on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run -- shows the next version and its notes, changes nothing"
                type: boolean
                default: true
            bump:
                description: "Version step"
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major
                default: auto

# Two runs at once would read the same last tag and compute the same next
# version. Not cancelling: a release that dies after the publish leaves the tag
# and the commit behind.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # In front of the checks: the branch, the hand-written notes in
    # .release/next.md and the state of dev against main are known at dispatch.
    preflight:
        uses: stefgo/release-workflows/.github/workflows/preflight.yml@v1
        permissions:
            contents: read

    checks:
        needs: preflight
        uses: ./.github/workflows/ci.yml
        # Stated explicitly although these are the defaults: without this block the
        # called workflow inherits the caller's permissions, and the caller has
        # write access below. A call should not hand on what it does not need.
        permissions:
            contents: read

    # No build step of its own: prepublishOnly builds during npm publish, and
    # the checks job has already run the build as a check.
    release:
        needs: checks
        uses: stefgo/release-workflows/.github/workflows/release.yml@v1
        permissions:
            contents: write # tag, release, CHANGELOG/package.json commit
            packages: write # publish to GitHub Packages
            issues: write # @semantic-release/github comments on issues ...
            pull-requests: write # ... and on pull requests during a release
        with:
            dry_run: ${{ inputs.dry_run }}
            bump: ${{ inputs.bump }}
            # A library: a BREAKING CHANGE footer raises the major position.
            breaking: major
            npm_publish: true
