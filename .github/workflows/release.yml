name: Publish Release

# semantic-release derives the next version from the commit types since the last
# tag, writes CHANGELOG.md and package.json, publishes the package to GitHub
# Packages and pushes the tag.
#
# main gives a stable release, dev a prerelease on the beta dist-tag. A push to
# either of those two branches is therefore a publication -- which is why
# .githooks/pre-push allows pushing from them alone.
on:
    push:
        branches:
            - main
            - dev

# Two runs at once would read the same last tag and compute the same next
# version. Not cancelling: a release that dies after the publish leaves the tag
# and the commit behind.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    checks:
        uses: ./.github/workflows/ci.yml
        # Stated explicitly although these are the defaults: without this block the
        # called workflow inherits the caller's permissions, and the caller has
        # write access below. A call should not hand on what it does not need.
        permissions:
            contents: read

    release:
        name: Tag, publish and write the changelog
        needs: checks
        runs-on: ubuntu-latest
        permissions:
            contents: write # tag, release, CHANGELOG/package.json commit
            packages: write # publish to GitHub Packages
            issues: write # @semantic-release/github comments on issues ...
            pull-requests: write # ... and on pull requests during a release
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # semantic-release needs the full history and all tags to find the
                  # last release. persist-credentials: false, because the git plugin
                  # sets the remote itself using GITHUB_TOKEN.
                  fetch-depth: 0
                  persist-credentials: false

            # registry-url writes the .npmrc that npm publish authenticates with,
            # reading the token from NODE_AUTH_TOKEN below.
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: "https://npm.pkg.github.com"

            # See ci.yml: npm 10 and npm 11 do not write the same lockfile.
            - name: Pin npm
              run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

            - name: Install dependencies
              run: npm ci

            # No build step of its own: prepublishOnly builds during npm publish, and
            # the checks job has already run the build as a check.
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
